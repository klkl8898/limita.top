<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>limita.top</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #fef9e7;
      font-family: 'Segoe UI', 'Hiragino Sans', 'Microsoft YaHei', 'PingFang SC', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      background-image: radial-gradient(circle at 30% 40%, #ffe8d6 5%, transparent 15%),
                        radial-gradient(circle at 70% 80%, #ffd7ba 8%, transparent 20%);
    }
    #password-screen, #blog-screen {
      display: none;
      width: 100%;
      max-width: 400px;
    }
    .card {
      background: rgba(255, 251, 245, 0.9);
      backdrop-filter: blur(15px);
      border-radius: 2rem;
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 40px rgba(180, 120, 80, 0.15);
      text-align: center;
    }
    .prompt {
      color: #b4845c;
      font-size: 1.2rem;
      margin-bottom: 1.8rem;
      font-weight: 400;
    }
    .input-group {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 1.8rem;
    }
    .digit-input {
      width: 75px;
      padding: 0.7rem 0.3rem;
      text-align: center;
      font-size: 1.6rem;
      border: 2px solid #f0d8bf;
      border-radius: 1.5rem;
      background: #fffcf5;
      color: #6b4e3d;
      outline: none;
      transition: 0.2s;
      font-family: inherit;
    }
    .digit-input:focus {
      border-color: #e3b28b;
      box-shadow: 0 0 0 4px rgba(230, 180, 130, 0.2);
    }
    .separator {
      font-size: 1.8rem;
      color: #dbb594;
      margin: 0 0.1rem;
    }
    .cute-btn {
      background: #f7d5b0;
      border: none;
      padding: 0.7rem 2rem;
      border-radius: 3rem;
      font-size: 1rem;
      color: #5d4030;
      cursor: pointer;
      background: linear-gradient(145deg, #fce4c5, #f2cd9f);
      box-shadow: 0 6px 14px rgba(200, 140, 90, 0.2);
      transition: 0.2s;
    }
    .cute-btn:hover {
      background: #fbe1c0;
      transform: translateY(-1px);
    }
    .blog-title {
      font-size: 2rem;
      font-weight: 400;
      color: #ad7a5c;
    }
  </style>
</head>
<body>
  <!-- 密码界面 -->
  <div id="password-screen">
    <div class="card">
      <div class="prompt">请输入密码</div>
      <div class="input-group">
        <input type="number" id="month-input" class="digit-input" placeholder="月" min="1" max="12" inputmode="numeric">
        <span class="separator">·</span>
        <input type="number" id="day-input" class="digit-input" placeholder="日" min="1" max="31" inputmode="numeric">
      </div>
      <button class="cute-btn" id="submit-password">进入</button>
    </div>
  </div>

  <!-- 博客主页（空） -->
  <div id="blog-screen">
    <div class="card">
      <h1 class="blog-title">我和limita的博客！</h1>
    </div>
  </div>

  <script>
    (function() {
      const passwordScreen = document.getElementById('password-screen');
      const blogScreen = document.getElementById('blog-screen');
      const monthInput = document.getElementById('month-input');
      const dayInput = document.getElementById('day-input');
      const submitBtn = document.getElementById('submit-password');

      const CORRECT_MONTH = 12;
      const CORRECT_DAY = 5;

      function checkSession() {
        if (sessionStorage.getItem('limita_blog_unlocked') === 'true') {
          showBlog();
        } else {
          showPasswordScreen();
        }
      }

      function showPasswordScreen() {
        passwordScreen.style.display = 'block';
        blogScreen.style.display = 'none';
      }

      function showBlog() {
        passwordScreen.style.display = 'none';
        blogScreen.style.display = 'block';
        sessionStorage.setItem('limita_blog_unlocked', 'true');
      }

      function validateAndEnter() {
        const monthVal = parseInt(monthInput.value.trim(), 10);
        const dayVal = parseInt(dayInput.value.trim(), 10);

        if (isNaN(monthVal) || isNaN(dayVal)) return;
        if (monthVal === CORRECT_MONTH && dayVal === CORRECT_DAY) {
          showBlog();
        } else {
          monthInput.style.transform = 'translateX(3px)';
          dayInput.style.transform = 'translateX(-3px)';
          setTimeout(() => {
            monthInput.style.transform = '';
            dayInput.style.transform = '';
          }, 200);
        }
      }

      submitBtn.addEventListener('click', validateAndEnter);

      monthInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          dayInput.focus();
        }
      });
      dayInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          validateAndEnter();
        }
      });

      monthInput.addEventListener('input', function() {
        if (monthInput.value.length >= 2) dayInput.focus();
      });

      checkSession();
    })();
  </script>
</body>
</html>
