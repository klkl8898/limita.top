<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>limita.top</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #ffffff;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 50 50"><path d="M25 2 L28 19 L46 19 L30 30 L35 47 L25 37 L15 47 L20 30 L4 19 L22 19 Z" fill="%23d0c0e0" opacity="0.3"/></svg>');
      background-size: 50px 50px;
      font-family: 'Times New Roman', Times, serif;
      color: #000000;
      padding: 20px;
      position: relative;
      min-height: 100vh;
      transition: background-color 0.8s;
    }

    body.day3-theme {
      background-color: #e8e8e8;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 50 50"><path d="M25 2 L28 19 L46 19 L30 30 L35 47 L25 37 L15 47 L20 30 L4 19 L22 19 Z" fill="%23a0a0a0" opacity="0.25"/></svg>');
    }

    /* 古早贴纸 */
    .sticker {
      position: fixed;
      pointer-events: none;
      font-size: 1.2rem;
      opacity: 0.7;
      animation: twinkle 2s infinite;
      filter: none;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.1); }
    }
    .sticker:nth-child(1) { top: 5%; left: 3%; animation-delay: 0s; }
    .sticker:nth-child(2) { top: 10%; right: 5%; animation-delay: 0.4s; }
    .sticker:nth-child(3) { top: 45%; left: 2%; animation-delay: 0.8s; }
    .sticker:nth-child(4) { top: 70%; right: 4%; animation-delay: 1.2s; }
    .sticker:nth-child(5) { top: 85%; left: 8%; animation-delay: 1.6s; }
    .sticker:nth-child(6) { top: 30%; right: 2%; animation-delay: 0.2s; font-size: 1rem; }

    /* 闪烁文字 */
    blink, .blink {
      animation: blinker 1s step-start infinite;
    }
    @keyframes blinker {
      50% { opacity: 0; }
    }

    /* 通用布局 */
    #password-screen, #blog-screen {
      display: none;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    /* 密码窗口 - 简单线框 */
    .window-box {
      border: 2px solid #666666;
      background: #ffffff;
      padding: 15px;
      margin: 20px auto;
      text-align: center;
    }
    .window-title {
      font-size: 1rem;
      font-weight: bold;
      text-align: center;
      border-bottom: 1px solid #666666;
      padding-bottom: 5px;
      margin-bottom: 15px;
      letter-spacing: 1px;
    }

    .prompt {
      font-size: 1rem;
      margin-bottom: 1.2rem;
      color: #000000;
    }

    .input-group {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.3rem;
      margin-bottom: 1.2rem;
    }

    .digit-input {
      width: 65px;
      padding: 4px 2px;
      text-align: center;
      font-size: 1.3rem;
      border: 1px solid #666666;
      background: #fcfcfc;
      color: #000000;
      font-family: 'Courier New', monospace;
    }
    .digit-input:focus {
      outline: 1px solid #999999;
      border-color: #333333;
    }

    .separator {
      font-size: 1.3rem;
      color: #333333;
    }

    .cute-btn {
      background: #dddddd;
      border: 1px outset #999999;
      padding: 4px 20px;
      font-size: 0.9rem;
      color: #000000;
      cursor: pointer;
      font-family: 'Times New Roman', serif;
      letter-spacing: 0.5px;
    }
    .cute-btn:active {
      border-style: inset;
      background: #cccccc;
    }

    /* 博客主区域 */
    .blog-title {
      font-size: 1.6rem;
      font-weight: bold;
      text-align: center;
      margin: 20px 0 15px;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-bottom: 2px solid #666666;
      display: inline-block;
      padding-bottom: 5px;
    }

    .post-container {
      border: 1px solid #666666;
      background: #ffffff;
      padding: 12px;
      margin: 15px 0;
      text-align: left;
    }
    .day3-theme .post-container {
      background: #f5f5f5;
      border-color: #888888;
    }

    .post-header {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 0.8rem;
      padding-bottom: 0.3rem;
      border-bottom: 1px dashed #666666;
      color: #000000;
    }

    .post-content {
      line-height: 1.6;
      white-space: pre-wrap;
      font-size: 0.9rem;
      color: #000000;
    }

    .post-content img {
      max-width: 100%;
      border: 1px solid #666666;
      margin: 8px 0;
      display: block;
      filter: grayscale(20%) brightness(0.9);
    }

    .lost-data {
      color: #888888;
      font-style: italic;
      opacity: 0.8;
    }

    .nav-buttons {
      text-align: center;
      margin: 15px 0;
    }
    .nav-buttons .cute-btn {
      font-size: 0.9rem;
    }

    /* 评论区 */
    .comment-section {
      border-top: 1px dashed #666666;
      margin-top: 12px;
      padding-top: 10px;
    }
    .comment-input-group {
      margin-bottom: 8px;
    }
    .comment-input-group input,
    .comment-input-group textarea {
      width: 100%;
      padding: 3px 6px;
      border: 1px solid #666666;
      background: #fcfcfc;
      font-family: 'Times New Roman', serif;
      font-size: 0.9rem;
      margin-top: 4px;
      color: #000000;
    }
    .comment-input-group textarea {
      resize: vertical;
    }
    .error-msg {
      color: #aa0000;
      font-size: 0.8rem;
      margin: 4px 0;
    }
    .comment-display {
      background: #f8f8f8;
      border: 1px solid #666666;
      padding: 6px 10px;
      margin: 8px 0;
      font-style: italic;
    }
    .hidden {
      display: none;
    }

    .number-grid {
      font-family: 'Courier New', monospace;
      margin-top: 8px;
      color: #444444;
      line-height: 1.6;
      letter-spacing: 1px;
    }

    .exclamation-toggle {
      display: inline-block;
    }

    .repeating-text {
      word-break: break-all;
      color: #555555;
      font-size: 0.8rem;
      line-height: 1.4;
      opacity: 0.8;
    }

    hr {
      border: none;
      border-top: 1px solid #666666;
      margin: 15px 0;
    }
  </style>
</head>
<body>

  <!-- 古早贴纸：闪烁星星、花朵、蝴蝶 -->
  <div class="sticker">⭐</div>
  <div class="sticker">🌸</div>
  <div class="sticker">🦋</div>
  <div class="sticker">✨</div>
  <div class="sticker">🌙</div>
  <div class="sticker">💫</div>

  <!-- 密码界面 -->
  <div id="password-screen">
    <div class="window-box">
      <div class="window-title">🔐 limita.top</div>
      <div class="prompt">请输入密码</div>
      <div class="input-group">
        <input type="number" id="month-input" class="digit-input" placeholder="月" min="1" max="12" inputmode="numeric">
        <span class="separator">-</span>
        <input type="number" id="day-input" class="digit-input" placeholder="日" min="1" max="31" inputmode="numeric">
      </div>
      <button class="cute-btn" id="submit-password">进入</button>
      <div style="margin-top:10px;font-size:0.8rem;color:#666;">(limita的生日)</div>
    </div>
  </div>

  <!-- 博客主页 -->
  <div id="blog-screen">
    <div style="text-align:center;">
      <div class="blog-title">我和limita的博客！</div>
    </div>

    <div class="post-container">
      <div class="post-header" id="post-title">第一天</div>
      <div class="post-content" id="post-body"></div>

      <!-- 评论区 -->
      <div id="comment-area" class="comment-section hidden">
        <div id="comment-login">
          <div style="font-weight:bold;margin-bottom:5px;">🔒 查看评论 (请登录)</div>
          <div class="comment-input-group">
            <input type="text" id="comment-account" placeholder="账号" autocomplete="off">
            <input type="password" id="comment-password" placeholder="密码">
          </div>
          <button class="cute-btn" id="view-comment-btn">查看评论</button>
          <div class="error-msg" id="login-error"></div>
        </div>
        <div id="comment-logged" class="hidden">
          <div class="comment-display">
            <strong>千：</strong>你是真实的吗？
          </div>
          <div class="comment-input-group" style="margin-top:8px;">
            <textarea id="new-comment" rows="2" placeholder="写下你的评论..."></textarea>
          </div>
          <button class="cute-btn" id="submit-comment-btn">提交评论</button>
          <div class="error-msg" id="comment-error"></div>
        </div>
      </div>
    </div>

    <div class="nav-buttons">
      <button class="cute-btn" id="next-post-btn">下一篇文章 →</button>
    </div>

    <hr>
    <div style="text-align:center;font-size:0.7rem;color:#888888;">
      ★ 2004 千的手作博客 ★<br>
      <span class="blink">●</span> 欢迎光临 <span class="blink">●</span>
    </div>
  </div>

  <script>
    (function() {
      const posts = [
        {
          title: "第一天",
          content: `limita！对我们的博客满意吗？
不满意也不行啦～这可是我花了三天做出来的
呃，如果你想，对这个网站提点建议，可以在评论区评论！
网站账号就是你的名字，密码是<span class="lost-data">&lt;数据丢失&gt;</span>，直接输入就好啦！
就这样，这就是第一篇文章啦！`,
          hasComment: true
        },
        {
          title: "第二天",
          content: `今天和limita去野餐了，树下很凉爽！
<img src="picnic.png" alt="野餐照片">
limita还做了两人份的三明治！我很喜欢吃里面的培根哦
limita，跟你说一个很可怕的事情，就在前几天，我好像做了个噩梦，梦里你在一个黑色的大树下，我怎么叫你，你都不答应，真是吓死我了！
不过还好，那只是一场梦而已！
看到你还好好的，我真的很高兴！你能一直当我的朋友吗？`,
          hasComment: false
        },
        {
          title: "第三天",
          content: `limita今天有点不舒服。
<img src="real.png" alt="真实照片">
我问limita怎么了，她说自己感冒了，需要休息几天。
我给她带了新鲜的水果，但是她说没胃口吃。
唉，真希望limita早点好起来，这样我们就能再去野餐了<span class="exclamation-toggle" id="toggle-excl">！</span>

晚上我又去看了limita，她的脸色几乎是白色的，我很担心，我又想起我做的那场梦了。
但是，那不是现实，对吗？那不是现实，对吗？
limita，求你回答我。
<span class="repeating-text">我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要我不要</span>
<div class="number-grid">1 4 7
1 5 6
2 5 9
3 6 7
3 6 9</div>`,
          hasComment: false,
          specialClass: 'day3'
        },
        {
          title: "第四天",
          content: `我听见了，咔嚓、咔嚓……发条的声音。
我拼命想说出不一样的话，可嘴巴不听使唤。
limita，如果你看到这篇，请转动发条，把我拉出去。`,
          hasComment: false
        }
      ];

      let currentPostIndex = 0;
      let toggleInterval = null;

      const passwordScreen = document.getElementById('password-screen');
      const blogScreen = document.getElementById('blog-screen');
      const monthInput = document.getElementById('month-input');
      const dayInput = document.getElementById('day-input');
      const submitBtn = document.getElementById('submit-password');
      const postTitle = document.getElementById('post-title');
      const postBody = document.getElementById('post-body');
      const nextPostBtn = document.getElementById('next-post-btn');
      const commentArea = document.getElementById('comment-area');
      const commentLogin = document.getElementById('comment-login');
      const commentLogged = document.getElementById('comment-logged');
      const viewCommentBtn = document.getElementById('view-comment-btn');
      const submitCommentBtn = document.getElementById('submit-comment-btn');
      const loginError = document.getElementById('login-error');
      const commentError = document.getElementById('comment-error');
      const commentAccount = document.getElementById('comment-account');
      const commentPassword = document.getElementById('comment-password');
      const newComment = document.getElementById('new-comment');
      const body = document.body;

      const CORRECT_MONTH = 12;
      const CORRECT_DAY = 5;
      const CORRECT_ACCOUNT = "limita";
      const CORRECT_PASSWORD = "Good_Night";

      function checkSession() {
        if (sessionStorage.getItem('limita_blog_unlocked') === 'true') {
          showBlog();
        } else {
          showPasswordScreen();
        }
      }

      function showPasswordScreen() {
        passwordScreen.style.display = 'block';
        blogScreen.style.display = 'none';
      }

      function showBlog() {
        passwordScreen.style.display = 'none';
        blogScreen.style.display = 'block';
        sessionStorage.setItem('limita_blog_unlocked', 'true');
        renderPost(currentPostIndex);
      }

      function validateAndEnter() {
        const monthVal = parseInt(monthInput.value.trim(), 10);
        const dayVal = parseInt(dayInput.value.trim(), 10);
        if (isNaN(monthVal) || isNaN(dayVal)) return;
        if (monthVal === CORRECT_MONTH && dayVal === CORRECT_DAY) {
          showBlog();
        } else {
          monthInput.style.borderColor = '#aa0000';
          dayInput.style.borderColor = '#aa0000';
          setTimeout(() => {
            monthInput.style.borderColor = '#666666';
            dayInput.style.borderColor = '#666666';
          }, 300);
        }
      }

      submitBtn.addEventListener('click', validateAndEnter);
      monthInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); dayInput.focus(); }
      });
      dayInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); validateAndEnter(); }
      });
      monthInput.addEventListener('input', () => {
        if (monthInput.value.length >= 2) dayInput.focus();
      });

      function renderPost(index) {
        const post = posts[index];
        postTitle.textContent = post.title;
        postBody.innerHTML = post.content;

        if (post.hasComment) {
          commentArea.classList.remove('hidden');
          resetCommentUI();
        } else {
          commentArea.classList.add('hidden');
        }

        if (post.specialClass === 'day3') {
          body.classList.add('day3-theme');
        } else {
          body.classList.remove('day3-theme');
        }

        if (index === posts.length - 1) {
          nextPostBtn.textContent = '← 回到第一章';
        } else {
          nextPostBtn.textContent = '下一篇文章 →';
        }

        clearInterval(toggleInterval);
        if (post.specialClass === 'day3') {
          const toggleEl = document.getElementById('toggle-excl');
          if (toggleEl) {
            let showExcl = true;
            toggleInterval = setInterval(() => {
              showExcl = !showExcl;
              toggleEl.textContent = showExcl ? '！' : '？';
            }, 650);
          }
        }
      }

      function resetCommentUI() {
        commentLogin.classList.remove('hidden');
        commentLogged.classList.add('hidden');
        loginError.textContent = '';
        commentError.textContent = '';
        commentAccount.value = '';
        commentPassword.value = '';
        newComment.value = '';
      }

      nextPostBtn.addEventListener('click', () => {
        currentPostIndex = (currentPostIndex + 1) % posts.length;
        renderPost(currentPostIndex);
      });

      viewCommentBtn.addEventListener('click', () => {
        const account = commentAccount.value.trim();
        const pwd = commentPassword.value.trim();
        if (account === CORRECT_ACCOUNT && pwd === CORRECT_PASSWORD) {
          commentLogin.classList.add('hidden');
          commentLogged.classList.remove('hidden');
          loginError.textContent = '';
        } else {
          loginError.textContent = '账号或密码错误';
        }
      });

      submitCommentBtn.addEventListener('click', () => {
        commentError.textContent = '未知错误';
        newComment.value = '';
      });

      window.addEventListener('beforeunload', () => {
        clearInterval(toggleInterval);
      });

      checkSession();
    })();
  </script>
</body>
</html>
