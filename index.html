<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>limita.top</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    @font-face {
      font-family: 'PixelFont';
      src: local('SimSun'), local('MS PGothic'), local('Courier New');
    }

    body {
      background: #1a1028;
      font-family: 'PixelFont', 'SimSun', 'MS PGothic', 'Courier New', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      background-image:
        radial-gradient(ellipse at 50% 0%, rgba(180, 140, 200, 0.25) 0%, transparent 60%),
        radial-gradient(circle at 20% 80%, rgba(120, 100, 160, 0.2) 0%, transparent 40%),
        radial-gradient(circle at 80% 30%, rgba(200, 160, 180, 0.2) 0%, transparent 40%),
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.008) 2px, rgba(255,255,255,0.008) 4px),
        repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(255,255,255,0.008) 2px, rgba(255,255,255,0.008) 4px);
      background-size: 100% 100%, 100% 100%, 100% 100%, 100% 4px, 4px 100%;
      image-rendering: pixelated;
      transition: background-color 0.8s;
      position: relative;
      overflow-x: hidden;
    }

    /* 扫描线覆盖 */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 999;
      background: repeating-linear-gradient(0deg,
          transparent,
          transparent 3px,
          rgba(0, 0, 0, 0.03) 3px,
          rgba(0, 0, 0, 0.03) 4px);
    }

    /* 偶尔闪烁的噪点 */
    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 998;
      background: transparent;
      animation: noiseFlash 8s infinite;
    }

    @keyframes noiseFlash {
      0%, 93%, 95%, 100% { background: transparent; }
      94% { background: rgba(200, 180, 220, 0.03); }
    }

    body.day3-theme {
      background: #1c1c1e;
      background-image:
        radial-gradient(ellipse at 50% 0%, rgba(140, 140, 150, 0.2) 0%, transparent 60%),
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.005) 2px, rgba(255,255,255,0.005) 4px);
      background-size: 100% 100%, 100% 4px;
    }

    #password-screen,
    #blog-screen {
      display: none;
      width: 100%;
      max-width: 520px;
      z-index: 1;
    }

    /* ===== Windows 98 风格窗口 ===== */
    .window-frame {
      background: #c8c0d0;
      border: 3px solid;
      border-color: #e8e0f0 #5a4a6a #5a4a6a #e8e0f0;
      box-shadow:
        inset 1px 1px 0 0 #f0e8f8,
        inset -1px -1px 0 0 #6a5a7a,
        4px 4px 0px rgba(0, 0, 0, 0.35);
      image-rendering: pixelated;
    }

    .window-titlebar {
      background: linear-gradient(90deg, #4a3070, #6a5090, #4a3070);
      padding: 6px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #3a2058;
      font-size: 0.85rem;
      color: #f0e0ff;
      letter-spacing: 1px;
      text-shadow: 1px 1px 0 #2a1040;
      font-family: 'PixelFont', 'SimSun', monospace;
    }

    .window-titlebar .title-text {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .window-titlebar .title-icon {
      font-size: 1rem;
      filter: drop-shadow(1px 1px 0 #1a0030);
    }

    .window-controls {
      display: flex;
      gap: 4px;
    }

    .win-btn {
      width: 20px;
      height: 20px;
      background: #b8a8c8;
      border: 2px solid;
      border-color: #e0d0f0 #5a4a6a #5a4a6a #e0d0f0;
      font-size: 0.65rem;
      line-height: 16px;
      text-align: center;
      cursor: default;
      color: #3a2a4a;
      font-weight: bold;
      image-rendering: pixelated;
      box-shadow: inset 1px 1px 0 #d0c0e0;
    }

    .win-btn:active {
      border-color: #5a4a6a #e0d0f0 #e0d0f0 #5a4a6a;
    }

    .window-body {
      background: #f5eff8;
      padding: 20px 18px;
      text-align: center;
      border-top: 1px solid #f8f0ff;
      position: relative;
    }

    .day3-theme .window-body {
      background: #e8e5ea;
    }

    /* ===== 密码界面 ===== */
    .prompt {
      color: #4a3070;
      font-size: 1rem;
      margin-bottom: 1.5rem;
      font-weight: normal;
      letter-spacing: 2px;
      text-shadow: 0px 0px 2px rgba(100, 60, 140, 0.2);
      animation: textFlicker 6s infinite;
    }

    @keyframes textFlicker {
      0%, 40%, 44%, 48%, 100% { opacity: 1; }
      42% { opacity: 0.7; }
      46% { opacity: 0.9; }
    }

    .input-group {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .digit-input {
      width: 70px;
      padding: 0.6rem 0.3rem;
      text-align: center;
      font-size: 1.5rem;
      border: 2px solid;
      border-color: #6a5a7a #d0c0e0 #d0c0e0 #6a5a7a;
      border-radius: 2px;
      background: #faf5ff;
      color: #3a2a4a;
      outline: none;
      transition: 0.15s;
      font-family: 'PixelFont', 'SimSun', 'Courier New', monospace;
      box-shadow: inset 1px 1px 3px rgba(0, 0, 0, 0.1);
      image-rendering: pixelated;
    }

    .digit-input:focus {
      border-color: #8060a0 #c0a0d0 #c0a0d0 #8060a0;
      box-shadow: 0 0 0 3px rgba(120, 80, 160, 0.2),
        inset 1px 1px 3px rgba(0, 0, 0, 0.1);
    }

    .separator {
      font-size: 1.6rem;
      color: #5a4a6a;
      margin: 0 0.1rem;
      text-shadow: 0 0 3px rgba(100, 60, 140, 0.3);
    }

    .cute-btn {
      background: #c8b8d8;
      border: 2px solid;
      border-color: #e0d0f0 #6a5a7a #6a5a7a #e0d0f0;
      padding: 0.6rem 1.8rem;
      font-size: 0.95rem;
      color: #2a1a3a;
      cursor: pointer;
      font-family: 'PixelFont', 'SimSun', monospace;
      letter-spacing: 1px;
      box-shadow: 1px 1px 0 rgba(0, 0, 0, 0.2);
      transition: 0.1s;
      image-rendering: pixelated;
      position: relative;
    }

    .cute-btn:hover {
      background: #d8c8e8;
      border-color: #f0e0ff #7a6a8a #7a6a8a #f0e0ff;
      text-shadow: 0 0 4px rgba(150, 100, 200, 0.4);
    }

    .cute-btn:active {
      border-color: #6a5a7a #e0d0f0 #e0d0f0 #6a5a7a;
      box-shadow: inset 1px 1px 3px rgba(0, 0, 0, 0.2);
    }

    /* ===== 博客主页 ===== */
    .blog-title {
      font-size: 1.5rem;
      font-weight: normal;
      color: #3a2a50;
      margin-bottom: 1.2rem;
      letter-spacing: 2px;
      text-shadow: 0 0 6px rgba(150, 110, 200, 0.35);
      animation: titleGlow 4s ease-in-out infinite;
    }

    @keyframes titleGlow {
      0%, 100% { text-shadow: 0 0 6px rgba(150, 110, 200, 0.35); }
      50% { text-shadow: 0 0 12px rgba(180, 140, 220, 0.55), 0 0 20px rgba(160, 120, 200, 0.3); }
    }

    .post-container {
      text-align: left;
      background: #faf7fc;
      border: 2px solid;
      border-color: #d0c0e0 #8a7a9a #8a7a9a #d0c0e0;
      padding: 1.2rem;
      margin: 1.2rem 0;
      min-height: 180px;
      box-shadow: inset 1px 1px 0 #fff,
        inset -1px -1px 0 #c8b8d8;
      image-rendering: pixelated;
      position: relative;
    }

    .day3-theme .post-container {
      background: #ece9ef;
      border-color: #b0a8b8 #706878 #706878 #b0a8b8;
    }

    /* 偶尔出现轻微色差偏移 */
    .post-container::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: transparent;
      animation: chromaticShift 15s infinite;
    }

    @keyframes chromaticShift {
      0%, 85%, 100% { background: transparent; }
      86% { background: rgba(255, 200, 200, 0.015); }
      87% { background: rgba(200, 200, 255, 0.015); }
      88% { background: transparent; }
    }

    .post-header {
      font-size: 1.1rem;
      color: #4a3070;
      margin-bottom: 0.8rem;
      font-weight: normal;
      border-bottom: 2px dotted #c8b8d8;
      padding-bottom: 0.4rem;
      letter-spacing: 1px;
      text-shadow: 0 0 2px rgba(100, 60, 140, 0.2);
    }

    .post-content {
      color: #3a2a45;
      line-height: 1.8;
      white-space: pre-wrap;
      font-size: 0.9rem;
    }

    .post-content img {
      max-width: 100%;
      border-radius: 2px;
      margin: 0.8rem 0;
      display: block;
      border: 2px solid;
      border-color: #c8b8d8 #8a7a9a #8a7a9a #c8b8d8;
      filter: brightness(0.92) contrast(1.05) saturate(0.85);
      image-rendering: pixelated;
      transition: filter 4s;
    }

    .post-content img:hover {
      filter: brightness(1) contrast(1.1) saturate(1);
    }

    .lost-data {
      color: #b0a0b8;
      font-style: italic;
      text-shadow: 0 0 3px rgba(150, 120, 170, 0.3);
      animation: lostFade 3s ease-in-out infinite;
    }

    @keyframes lostFade {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 0.85; }
    }

    .nav-buttons {
      display: flex;
      justify-content: center;
      gap: 0.8rem;
      margin-top: 1rem;
    }

    /* ===== 评论区 ===== */
    .comment-section {
      margin-top: 1.2rem;
      border-top: 2px dotted #c8b8d8;
      padding-top: 1rem;
    }

    .comment-input-group {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-bottom: 0.8rem;
    }

    .comment-input-group input,
    .comment-input-group textarea {
      padding: 0.5rem 0.8rem;
      border: 2px solid;
      border-color: #8a7a9a #d0c0e0 #d0c0e0 #8a7a9a;
      border-radius: 2px;
      background: #faf5ff;
      outline: none;
      font-family: 'PixelFont', 'SimSun', monospace;
      font-size: 0.85rem;
      color: #3a2a4a;
      box-shadow: inset 1px 1px 2px rgba(0, 0, 0, 0.06);
    }

    .comment-input-group textarea {
      resize: none;
    }

    .error-msg {
      color: #a05060;
      font-size: 0.8rem;
      margin-top: 0.4rem;
      animation: errorBlink 0.5s ease-in-out 2;
    }

    @keyframes errorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .comment-display {
      background: #f3edf8;
      padding: 0.8rem 1rem;
      border: 1px solid #c8b8d8;
      margin: 0.8rem 0;
      font-style: italic;
      color: #4a3a5a;
      border-radius: 2px;
      box-shadow: inset 0 0 8px rgba(120, 80, 160, 0.06);
      position: relative;
    }

    .comment-display::before {
      content: '▼ ';
      color: #8a7a9a;
      font-size: 0.7rem;
    }

    .hidden {
      display: none;
    }

    .number-grid {
      font-family: 'Courier New', monospace;
      margin-top: 0.8rem;
      color: #7a6a8a;
      line-height: 1.7;
      letter-spacing: 2px;
      font-size: 0.85rem;
    }

    .exclamation-toggle {
      display: inline-block;
      min-width: 0.5em;
    }

    .repeating-text {
      word-break: break-all;
      color: #6a5a75;
      font-size: 0.82rem;
      line-height: 1.6;
      opacity: 0.8;
    }

    /* 星星装饰 */
    .star {
      position: fixed;
      pointer-events: none;
      z-index: 0;
      font-size: 0.7rem;
      opacity: 0.5;
      animation: starTwinkle 3s ease-in-out infinite;
      color: #d0c0e8;
    }

    @keyframes starTwinkle {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.75; }
    }

    /* 响应式 */
    @media (max-width: 450px) {
      .window-body {
        padding: 15px 10px;
      }
      .digit-input {
        width: 55px;
        font-size: 1.3rem;
      }
      .blog-title {
        font-size: 1.2rem;
      }
    }
  </style>
</head>

        if (sessionStorage.getItem('limita_blog_unlocked') === 'true') {
          showBlog();
        } else {
          showPasswordScreen();
        }
      }

      function showPasswordScreen() {
        passwordScreen.style.display = 'block';
        blogScreen.style.display = 'none';
      }

      function showBlog() {
        passwordScreen.style.display = 'none';
        blogScreen.style.display = 'block';
        sessionStorage.setItem('limita_blog_unlocked', 'true');
        renderPost(currentPostIndex);
      }

      function validateAndEnter() {
        const monthVal = parseInt(monthInput.value.trim(), 10);
        const dayVal = parseInt(dayInput.value.trim(), 10);
        if (isNaN(monthVal) || isNaN(dayVal)) return;
        if (monthVal === CORRECT_MONTH && dayVal === CORRECT_DAY) {
          showBlog();
        } else {
          monthInput.style.transform = 'translateX(4px)';
          dayInput.style.transform = 'translateX(-4px)';
          setTimeout(() => {
            monthInput.style.transform = '';
            dayInput.style.transform = '';
          }, 180);
        }
      }

      submitBtn.addEventListener('click', validateAndEnter);
      monthInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') { e.preventDefault();
          dayInput.focus(); }
      });
      dayInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') { e.preventDefault();
          validateAndEnter(); }
      });
      monthInput.addEventListener('input', () => {
        if (monthInput.value.length >= 2) dayInput.focus();
      });

      function renderPost(index) {
        const post = posts[index];
        postTitle.textContent = post.title;
        postBody.innerHTML = post.content;

        if (post.hasComment) {
          commentArea.classList.remove('hidden');
          resetCommentUI();
        } else {
          commentArea.classList.add('hidden');
        }

        if (post.specialClass === 'day3') {
          body.classList.add('day3-theme');
        } else {
          body.classList.remove('day3-theme');
        }

        // 导航按钮文字
        if (index === posts.length - 1) {
          nextPostBtn.textContent = '← 回到第一章';
        } else {
          nextPostBtn.textContent = '下一篇文章 →';
        }

        clearInterval(toggleInterval);
        if (post.specialClass === 'day3') {
          const toggleEl = document.getElementById('toggle-excl');
          if (toggleEl) {
            let showExcl = true;
            toggleInterval = setInterval(() => {
              showExcl = !showExcl;
              toggleEl.textContent = showExcl ? '！' : '？';
            }, 650);
          }
        }
      }

      function resetCommentUI() {
        commentLogin.classList.remove('hidden');
        commentLogged.classList.add('hidden');
        loginError.textContent = '';
        commentError.textContent = '';
        commentAccount.value = '';
        commentPassword.value = '';
        newComment.value = '';
      }

      nextPostBtn.addEventListener('click', () => {
        currentPostIndex = (currentPostIndex + 1) % posts.length;
        renderPost(currentPostIndex);
      });

      viewCommentBtn.addEventListener('click', () => {
        const account = commentAccount.value.trim();
        const pwd = commentPassword.value.trim();
        if (account === CORRECT_ACCOUNT && pwd === CORRECT_PASSWORD) {
          commentLogin.classList.add('hidden');
          commentLogged.classList.remove('hidden');
          loginError.textContent = '';
        } else {
          loginError.textContent = '账号或密码错误';
        }
      });

      submitCommentBtn.addEventListener('click', () => {
        commentError.textContent = '未知错误';
        newComment.value = '';
      });

      window.addEventListener('beforeunload', () => {
        clearInterval(toggleInterval);
      });

      checkSession();
    })();
  </script>
</body>
</html>
